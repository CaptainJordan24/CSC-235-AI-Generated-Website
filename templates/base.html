<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CT Beginner Hikes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4lpvucax1QdBFW0Q2VfRE/jRjm84VuY8QfAf0+KwY5p3x0y0G0bQ5x9Yt4+BJ5xq" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-forest text-light">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header py-3 shadow-sm">
    <div class="container d-flex flex-wrap align-items-center justify-content-between">
      <div>
        <a class="navbar-brand text-white fs-3 fw-bold text-decoration-none" href="{{ url_for('home') }}">CT Trail Guide</a>
        <p class="small text-muted mb-0">Beginner-friendly hikes, planning, weather and reviews.</p>
      </div>
      <nav aria-label="Primary navigation">
        <ul class="nav">
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('home') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('hiking') }}">Hiking</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('packing') }}">Packing</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('reviews') }}">Reviews</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('weather') }}">Weather</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content" class="container py-5">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer py-4 bg-dark text-light">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
      <p class="mb-2 mb-md-0">Designed for new hikers exploring Connecticut.</p>
      <p class="mb-0">Accessible components • High-contrast palette • Mobile-friendly</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-vA1a7ONc2uPsH/u5x9j7oXEt5pjv8YKD1eG6URvqDkp2fQJ7fR6hW9nQPtQuQ4jj" crossorigin="anonymous"></script>
  <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
